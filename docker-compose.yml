services:
  db:
    image: postgres:16-alpine
    container_name: projectflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectflow}
      POSTGRES_USER: ${POSTGRES_USER:-projectflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-projectflow} -d $${POSTGRES_DB:-projectflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - projectflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectflow}:${POSTGRES_PASSWORD:-projectflow}@db:5432/${POSTGRES_DB:-projectflow}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-projectflow-demo-secret-key-change-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DEMO_MODE: ${DEMO_MODE:-True}
      TASK_RUNNER_SYNC: ${TASK_RUNNER_SYNC:-False}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.locmem.EmailBackend}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - staticfiles_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - projectflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - projectflow-network

networks:
  projectflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  staticfiles_data:
    driver: local
